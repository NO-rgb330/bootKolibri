<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>KolibriOS Web VM</title>
    
    <!-- Required for v86 to use threading/SharedArrayBuffer on GitHub Pages -->
    <script src="coi-serviceworker.js"></script>
    
    <!-- Load the v86 engine -->
    <script src="v86/libv86.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* The container where v86 injects the canvas */
        #screen_container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen_container canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Hide the host cursor when the mouse is captured */
        #screen_container.locked canvas {
            cursor: none !important;
        }

        /* Floating UI Overlay */
        #overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        #overlay:hover {
            opacity: 1;
        }

        #overlay button {
            background: rgba(40, 40, 40, 0.8);
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        #overlay button:hover {
            background: rgba(80, 80, 80, 0.9);
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #status-text { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="status-text">Fetching KolibriOS image...</div>
    </div>

    <div id="screen_container" tabindex="0"></div>

    <div id="overlay">
        <button id="btn-fs">⛶ Fullscreen</button>
        <button id="btn-restart">↻ Restart</button>
    </div>

    <script>
        const screenContainer = document.getElementById('screen_container');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('status-text');
        const btnFs = document.getElementById('btn-fs');
        const btnRestart = document.getElementById('btn-restart');

        let emulator = null;

        // 1. Force fullscreen
        btnFs.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // 2. Handle Mouse Capture (Fixes the "two mouses" issue)
        // When clicking the VM, lock the pointer. Pressing Esc releases it.
        screenContainer.addEventListener('click', (e) => {
            // Only lock if we click the canvas and aren't already locked
            if (e.target.tagName === 'CANVAS' && !document.pointerLockElement) {
                e.target.requestPointerLock();
            }
        });

        // UI feedback for mouse lock state
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement) {
                screenContainer.classList.add('locked');
            } else {
                screenContainer.classList.remove('locked');
            }
        });

        // 3. Initialize the Emulator
        async function startVM() {
            if (emulator) {
                emulator.stop();
                emulator = null;
                screenContainer.innerHTML = '';
            }
            
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            statusText.textContent = 'Fetching KolibriOS image...';

            try {
                // Fetch the OS image from the /v86/ folder
                const response = await fetch('v86/kolibrios-0.7.7.0-9252-g17a0b9d7-en_US.img');
                if (!response.ok) throw new Error('Failed to load image. Check if it exists in /v86/');
                const imageBuffer = await response.arrayBuffer();

                statusText.textContent = 'Booting KolibriOS...';

                // Boot v86
                emulator = new V86({
                    wasm_path: 'v86/v86.wasm',
                    memory_size: 64 * 1024 * 1024, // 64 MB RAM
                    vga_memory_size: 8 * 1024 * 1024,
                    screen_container: screenContainer,
                    bios: { url: 'v86/seabios.bin' },
                    vga_bios: { url: 'v86/vgabios.bin' },
                    
                    // Mount the KolibriOS image as a floppy drive
                    fda: { buffer: imageBuffer },
                    
                    // Enable networking for internet access
                    nic_type: 'ne2k',
                    network_relay_url: 'wss://relay.widgetry.org/', 
                    
                    disable_speaker: true,
                    autostart: true,
                });

                // Hide the loader once the emulator is ready
                emulator.add_listener('emulator-ready', () => {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                    
                    // Auto-focus the canvas so keyboard works immediately
                    const canvas = screenContainer.querySelector('canvas');
                    if (canvas) canvas.focus();
                });

            } catch (err) {
                statusText.textContent = 'Error: ' + err.message;
                console.error(err);
            }
        }

        btnRestart.addEventListener('click', startVM);

        // Start on load
        startVM();
    </script>
</body>
</html>
